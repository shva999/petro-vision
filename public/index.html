<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetroVision — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-shell">
    <div class="auth-card">

      <div class="auth-logo"> Petro<span class="accent">Vision</span></div>
      <p class="auth-tagline">Crowdsourced fuel prices, station locations, and trip cost estimates — built by drivers, for drivers.</p>

      <!-- Two tabs that just show/hide the two forms below with JS.
           This keeps login + signup on one page/one file. -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tab-login">Log In</button>
        <button type="button" class="auth-tab" id="tab-signup">Sign Up</button>
      </div>

      <div id="banner"></div>

      <!-- ===== LOG IN FORM ===== -->
      <form id="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required>
        </div>
        <button type="submit" class="btn btn-block">Log In</button>
      </form>

      <!-- ===== SIGN UP FORM (hidden by default) ===== -->
      <form id="signup-form" style="display:none;">
        <div class="field">
          <label for="signup-fullname">Full name</label>
          <input type="text" id="signup-fullname" required>
        </div>
        <div class="field">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="signup-password">Choose a password</label>
          <input type="password" id="signup-password" minlength="8" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-block">Create Account</button>
      </form>

      <p class="auth-demo">Your account and data are stored by the PetroVision API.</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
